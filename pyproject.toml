[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["u-connectClient", "build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tests"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true


name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init u-connectClient (not its nested submodules)
        run: git submodule update --init u-connectClient
      - run: cmake -S u-connectClientApp -B build -A x64
      - run: cmake --build build --config Release
      - run: Copy-Item u-connectClientApp/bin/u-connectClientApp.exe u-connectClientApp-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: u-connectClientApp-windows-x64.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init u-connectClient (not its nested submodules)
        run: git submodule update --init u-connectClient
      - run: cmake -S u-connectClientApp -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: cp u-connectClientApp/bin/ucxapp u-connectClientApp-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: u-connectClientApp-linux-x64

  stm32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nucleo_h753zi
            repo: STM32CubeH7
          - board: nucleo_f767zi
            repo: STM32CubeF7
          - board: nucleo_f439zi
            repo: STM32CubeF4
    steps:
      - uses: actions/checkout@v4
      - name: Init u-connectClient (not its nested submodules)
        run: git submodule update --init u-connectClient
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
      - name: Fetch STM32Cube HAL
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/STMicroelectronics/${{ matrix.repo }} "$RUNNER_TEMP/hal"
      - name: Build
        run: |
          cmake -G Ninja -S u-connectClientApp/stm32 -B build/stm32 \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/u-connectClient/cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_BOARD=${{ matrix.board }} -DSTM32_HAL_PATH="$RUNNER_TEMP/hal" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/stm32
      - uses: actions/upload-artifact@v4
        with:
          name: stm32-${{ matrix.board }}
          path: |
            build/bin/ucxapp_${{ matrix.board }}.bin
            build/bin/ucxapp_${{ matrix.board }}.hex
            build/bin/ucxapp_${{ matrix.board }}.elf

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, stm32]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

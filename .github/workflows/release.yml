name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - run: cmake -S app -B build/windows -A x64
      - run: cmake --build build/windows --config Release
      - run: Copy-Item app/bin/ucxapp.exe ucxapp-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ucxapp-windows-x64.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - run: cmake -S app -B build/linux -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/linux
      - name: Package
        run: |
          mkdir -p pkg/ucxapp-linux-x64
          cp app/bin/ucxapp pkg/ucxapp-linux-x64/
          (cd pkg/ucxapp-linux-x64 && sha256sum ucxapp > ucxapp.sha256)
          tar -czf ucxapp-linux-x64.tar.gz -C pkg ucxapp-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ucxapp-linux-x64.tar.gz

  stm32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nucleo_h753zi
            repo: STM32CubeH7
            ref: v1.12.1   # master no longer has FreeRTOS/Source/CMSIS_RTOS
          - board: nucleo_f767zi
            repo: STM32CubeF7
            ref: master
          - board: nucleo_f439zi
            repo: STM32CubeF4
            ref: master
          - board: f407_disc
            repo: STM32CubeF4
            ref: master
          - board: nucleo_f401re
            repo: STM32CubeF4
            ref: master
          - board: nucleo_f446re
            repo: STM32CubeF4
            ref: master
          - board: bluepill_f103c8
            repo: STM32CubeF1
            ref: master
    steps:
      - uses: actions/checkout@v4
      - name: Init u-connectClient (not its nested submodules)
        run: |
          git submodule update --init u-connectClient
          git submodule update --init --recursive third-party/mbedtls
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
      - name: Fetch STM32Cube HAL
        run: git clone --depth 1 --branch ${{ matrix.ref }} --recurse-submodules --shallow-submodules https://github.com/STMicroelectronics/${{ matrix.repo }} "$RUNNER_TEMP/hal"
      - name: Build
        run: |
          cmake -G Ninja -S app/stm32 -B build/stm32 \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/u-connectClient/cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_BOARD=${{ matrix.board }} -DSTM32_HAL_PATH="$RUNNER_TEMP/hal" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/stm32
      - name: Package
        run: |
          d=ucxapp-stm32-${{ matrix.board }}
          mkdir -p pkg/$d
          cp build/bin/ucxapp_${{ matrix.board }}.{bin,hex,elf} pkg/$d/
          (cd pkg/$d && sha256sum * > SHA256SUMS)
          (cd pkg && zip -r ../$d.zip $d)
      - uses: actions/upload-artifact@v4
        with:
          name: stm32-${{ matrix.board }}
          path: ucxapp-stm32-${{ matrix.board }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, stm32]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for body_path
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{linux,stm32-*}"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true   # signed Windows zip is added by release.py, then the draft is published
          body_path: .github/release-notes.md
          generate_release_notes: true
